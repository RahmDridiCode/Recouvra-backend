name: CI Backend

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOYMENT_REPO: RahmDridiCode/recouvra-deployment

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          MONGO_TEST_URI: mongodb://localhost:27017/recouvra_test
          # Valeur factice, réservée aux tests (aucun secret réel)
          JWT_SECRET: ci-test-secret

  build-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: vars
        run: |
          # GHCR exige un nom d'image en minuscules
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-deployment:
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Dispatch deploy-image to deployment repository
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
          IMAGE_TAG: ${{ needs.build-push.outputs.tag }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::Le secret DEPLOYMENT_TOKEN est absent de ce dépôt."
            exit 1
          fi
          status=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DEPLOYMENT_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${DEPLOYMENT_REPO}/dispatches" \
            -d "{\"event_type\":\"deploy-image\",\"client_payload\":{\"component\":\"backend\",\"tag\":\"${IMAGE_TAG}\"}}")
          if [ "$status" != "204" ]; then
            echo "::error::Échec du repository_dispatch (HTTP $status)."
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "Événement deploy-image envoyé : backend ${IMAGE_TAG}"
